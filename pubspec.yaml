name: xmusic
description: "Xmusic - 跨平台音乐播放器，汽水音乐风格 UI"
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  cached_network_image: ^3.4.1
  msgpack_dart: ^1.0.1
  pointycastle: ^3.9.1
  shared_preferences: ^2.3.3
  palette_generator: ^0.3.3+4
  flutter_animate: ^4.5.2
  file_picker: ^12.0.0
  youtube_explode_dart: ^3.1.0
  just_audio_windows: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  macos:
    generate: true
    image_path: assets/icon/app_icon_macos.png
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
  linux:
    generate: true
    image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  background_color_ios: "#000000"

flutter:
  uses-material-design: true
  fonts:
    - family: Syncopate
      fonts:
        - asset: assets/fonts/Syncopate-Regular.ttf
          weight: 400
        - asset: assets/fonts/Syncopate-Bold.ttf
          weight: 700
